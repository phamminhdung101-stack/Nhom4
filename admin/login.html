<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro&display=swap" rel="stylesheet">

    <style>
        :root {
            --admin-primary: #4e342e;
            --admin-bg: #f5f5f5;
        }

        body {
            font-family: "Be Vietnam Pro", sans-serif;
            background: var(--admin-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url("https://static.kienviet.net/storage/uploads/2025/02/tiem-tra-cua-trang-he-thong-khung-dung-bao-che-cong-trinh-sonstudio_3.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .card-box {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
        }

        .title {
            color: var(--admin-primary);
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-main {
            background: var(--admin-primary);
            color: #fff;
            border-radius: 10px;
            padding: 12px;
        }

        .btn-main:hover {
            background: #3e2723;
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- ADMIN LOGIN ONLY -->
    <div class="card-box">
        <h4 class="title">Đăng nhập Quản lý</h4>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Tài khoản</label>
                <input type="text" id="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" id="matKhau" class="form-control" required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-main">Đăng nhập</button>
            </div>

            <p id="message" class="mt-3 text-center text-danger"></p>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            let username = document.getElementById("username").value.trim();
            let matKhau = document.getElementById("matKhau").value.trim();

            fetch("http://localhost:8080/api/admin/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "username=" + encodeURIComponent(username) +
                      "&matKhau=" + encodeURIComponent(matKhau)
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(text); });
                }
                return response.json();
            })
            .then(data => {
                localStorage.setItem("adminId", data.id);
                localStorage.setItem("adminUsername", data.username);
                window.location.href = "dashboard.html";
            })
            .catch(error => {
                document.getElementById("message").innerText = error.message;
            });
        });
    </script>

</body>
</html>
