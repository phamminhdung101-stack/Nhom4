<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Quản lý QR bàn</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    font-family: 'Arial', sans-serif;
    background-color: #f5f6fa;
    margin: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 24px rgba(0,0,0,0.15);
}

img.qr {
    width: 160px;
    height: 160px;
    margin: 15px 0;
    border: 2px solid #1976d2;
    border-radius: 8px;
}

button, .actions a {
    padding: 8px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 500;
    transition: background-color 0.2s;
}

button {
    border: none;
    background-color: #28a745;
    color: #fff;
    cursor: pointer;
}

button:hover {
    background-color: #218838;
}

.actions a {
    background-color: #1976d2;
    color: #fff;
}

.actions a:hover {
    background-color: #155fa0;
}

.actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 10px;
}

.card h3 {
    margin-bottom: 10px;
    color: #1976d2;
}

</style>
</head>
<body>

<div class="container">
    <h2>Danh sách QR bàn</h2>

    <div class="grid">
        <div class="card" th:each="t : ${dsBan}">
            <h3 th:text="${t.tenBan}"></h3>

            <img class="qr"
                 th:src="'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='
                 + ${baseUrl} + '?ban=' + ${t.idBan}" 
                 alt="QR Code">

            <form method="post" th:action="@{/ban-an/cap-nhat-qr}" class="mb-2">
                <input type="hidden" name="idBan" th:value="${t.idBan}">
                <input type="hidden" name="maQR"
                       th:value="${baseUrl + '?ban=' + t.idBan}">
                <button type="submit">Lưu MaQR</button>
            </form>

            <div class="actions">
                <a th:href="${baseUrl + '?ban=' + t.idBan}" target="_blank">Mở link</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
