<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập quản lý - Tiệm Trà</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/app.css" />
    <style>
      body {
        font-family: "Be Vietnam Pro", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: linear-gradient(135deg, rgba(62, 39, 35, 0.85), rgba(141, 110, 99, 0.75)),
          url("https://static.kienviet.net/storage/uploads/2025/02/tiem-tra-cua-trang-he-thong-khung-dung-bao-che-cong-trinh-sonstudio_3.jpg")
            center / cover no-repeat, #4e342e;
      }
      .card-box {
        background: #fff;
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
      }
      .title { color: #4e342e; font-weight: 600; text-align: center; margin-bottom: 20px; }
      .btn-main { background: #4e342e; color: #fff; border-radius: 10px; padding: 12px; }
      .btn-main:hover { background: #3e2723; color: #fff; }
    </style>
  </head>
  <body>
    <main class="card-box">
      <h4 class="title"><i class="bi bi-cup-hot-fill me-2"></i>Đăng nhập Quản lý</h4>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username">Tài khoản</label>
          <input type="text" id="username" class="form-control" autocomplete="username" required autofocus />
        </div>
        <div class="mb-3">
          <label class="form-label" for="matKhau">Mật khẩu</label>
          <div class="input-group">
            <input type="password" id="matKhau" class="form-control" autocomplete="current-password" required />
            <button class="btn btn-outline-secondary" type="button" id="togglePw" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-main" id="btnLogin">Đăng nhập</button>
        </div>
        <p id="message" class="mt-3 mb-0 text-center text-danger small" role="alert"></p>
      </form>
    </main>

    <script src="../assets/js/app.js?v=20261029a"></script>
    <script>
      (function () {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const next = new URLSearchParams(location.search).get("next");
        const target = next && /^[a-z_]+\.html$/.test(next) ? next : "dashboard.html";

        if (App.getAdmin()) location.replace(target);

        $("togglePw").addEventListener("click", () => {
          const pw = $("matKhau");
          pw.type = pw.type === "password" ? "text" : "password";
        });

        $("loginForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const username = $("username").value.trim();
          const matKhau = $("matKhau").value;
          if (!username || !matKhau) {
            $("message").textContent = "Vui lòng nhập tài khoản và mật khẩu";
            return;
          }
          $("message").textContent = "";
          App.withBusy($("btnLogin"), async () => {
            try {
              const data = await App.api("/api/admin/login", {
                method: "POST",
                body: new URLSearchParams({ username, matKhau }),
                redirectOn401: false,
              });
              App.setAdmin(data);
              location.href = target;
            } catch (err) {
              $("message").textContent = err.message;
              $("matKhau").select();
            }
          });
        });
      })();
    </script>
  </body>
</html>
