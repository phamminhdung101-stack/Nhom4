# Mọi giá trị dạng ${TEN_BIEN:mac_dinh} đổi được bằng biến môi trường TEN_BIEN, không cần sửa file này.
# Bảng đầy đủ các biến: README.md mục 7.

# ==== Server ====
# Mặc định chạy HTTPS: https://<IP>:8443, WebSocket tự chuyển sang wss://.
# Chứng chỉ tự ký ssl/tiemtra.p12 được TỰ TẠO khi khởi động (ChungChiHttps.java), kèm IP Wi-Fi hiện tại;
# đổi mạng thì tự tạo lại. Không cần chạy script trong ssl/.
# Lần đầu mỗi máy / điện thoại sẽ cảnh báo "kết nối không riêng tư" -> Nâng cao -> Tiếp tục.
# Sau đó thanh địa chỉ vẫn ghi "Not secure", chữ https bị gạch: BÌNH THƯỜNG với chứng chỉ tự ký, kết nối VẪN MÃ HOÁ.
# (Muốn máy quản trị hiện ổ khoá: cho Windows tin chứng chỉ, xem README.md mục 6.)
# Chạy HTTP thường ở http://<IP>:8081 (không cảnh báo chứng chỉ): biến môi trường APP_HTTPS=false
# CHÚ Ý: đừng đặt PORT=8081 khi chạy HTTPS. HTTPS sẽ chiếm 8081, cổng chuyển hướng bị tắt,
#        nên link / mã QR http://<IP>:8081 báo lỗi. Muốn đổi cổng thì đổi cả PORT và HTTP_PORT.
server.port=${PORT:8443}
server.ssl.enabled=${APP_HTTPS:true}
server.ssl.key-store=file:ssl/tiemtra.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_PASSWORD:tiemtra123}
server.ssl.key-alias=tiemtra
# Cổng HTTP phụ, chỉ để chuyển hướng sang HTTPS: gõ http://<IP>:8081 hoặc quét mã QR cũ dạng http vẫn vào được.
# 0 = tắt. Khi APP_HTTPS=false thì không dùng (server chạy thẳng HTTP ở cổng chính).
app.http-port=${HTTP_PORT:8081}
# 0.0.0.0 = nhận kết nối trên mọi card mạng. Nếu để localhost / 127.0.0.1 thì chỉ máy chạy server vào được,
# điện thoại cùng Wi-Fi quét QR sẽ không kết nối được.
server.address=0.0.0.0
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

# ==== MongoDB ====
# Dạng mongodb://<máy>:<cổng>/<tên database>. Đổi tên database (vd. .../tiemtra_test) để thử nghiệm
# mà không đụng dữ liệu thật; database trống sẽ được tự nạp dữ liệu mẫu.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tiemtra}
# BẮT BUỘC bật: Spring Data mặc định KHÔNG tạo index từ @Indexed. Thiếu dòng này thì ràng buộc
# unique (mã đơn, mỗi bàn 1 giỏ...) không có tác dụng và truy vấn theo thời gian / trạng thái chậm dần khi dữ liệu nhiều.
spring.data.mongodb.auto-index-creation=true

# ==== Frontend tĩnh (src/main/resources/static) ====
# no-cache: trình duyệt vẫn lưu file nhưng LẦN NÀO cũng hỏi lại server "file có đổi không"
# (không đổi -> trả 304 rất nhanh). Nhờ vậy sửa HTML/JS xong mở lại trang là thấy bản mới,
# điện thoại khách không bị kẹt bản cũ. Các trang còn thêm ?v=... sau tên file JS để chắc chắn tải bản mới.
spring.web.resources.cache.cachecontrol.no-cache=true

# ==== Ứng dụng ====
# Thư mục ảnh món (1.jpg, 2.jpg... theo mã món), phục vụ tại /uploads/**. Đường dẫn tương đối với thư mục chạy server.
app.upload-dir=${APP_UPLOAD_DIR:./uploads}
# Origin được phép gọi API / WebSocket từ trang KHÁC cổng server (vd. Live Server khi dev).
# Trang do chính server phục vụ (kể cả qua IP Wi-Fi) luôn được phép, không cần liệt kê ở đây.
app.cors.allowed-origins=${APP_CORS_ORIGINS:https://localhost:[*],https://127.0.0.1:[*],http://localhost:[*],http://127.0.0.1:[*]}
# Thời hạn phiên đăng nhập nhân viên (giờ). Hết hạn phải đăng nhập lại.
app.auth.token-ttl-hours=12
# Máy thứ 2 trở đi quét QR của bàn đang có khách phải được NHÂN VIÊN cho phép (trang Sơ đồ bàn) mới đặt món được.
# Mục đích: chặn người lạ quét trộm QR, đặt món vào bàn người khác rồi bỏ đi để bàn đó trả tiền.
# Đặt false khi demo cho nhanh.
app.ban.duyet-may-moi=${APP_DUYET_MAY_MOI:true}
# Chạy xong tự mở trình duyệt vào trang quản trị bằng IP Wi-Fi của máy. false = tắt.
app.open-browser=${APP_OPEN_BROWSER:true}

# ==== Log ====
logging.level.root=INFO
logging.level.chandanv.local.chandanv=INFO
logging.level.org.springframework.data.mongodb=INFO
# Ghi log ra cả console và file. Nhật ký bảo mật (đăng nhập sai, mã bàn sai, spam...) có chữ "AUDIT", tìm trong file này.
logging.file.name=logs/app.log
logging.level.AUDIT=INFO
# Log không phình mãi: mỗi file tối đa 10MB (đầy thì sang file mới), giữ 7 ngày, tổng tối đa 100MB.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# ==== Bảo mật ====
# Lỗi trả về chỉ có câu thông báo đã chuẩn bị sẵn (GlobalExceptionHandler), không kèm stacktrace hay tên class:
# các thông tin đó cho kẻ tấn công biết server dùng thư viện gì, cấu trúc code ra sao.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
# Giới hạn kích thước request: chặn gửi dữ liệu khổng lồ làm tràn bộ nhớ server.
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
server.max-http-request-header-size=16KB

# ---- Các ngưỡng dưới đây đã NỚI cho đồ án / demo trên lớp (1 máy mở nhiều tab bếp, POS, sơ đồ bàn...) ----
# Muốn chặt hơn khi chạy thật: giảm số lần thử, tăng thời gian khoá, giảm số request mỗi phút.

# Chống dò mật khẩu: sai 10 lần (cùng tài khoản + IP) -> khoá 1 phút; 1 IP sai 30 lần (thử nhiều tài khoản) -> khoá IP 5 phút
app.security.login-max-failures=10
app.security.login-lock-minutes=1
app.security.login-ip-max-failures=30
app.security.login-ip-lock-minutes=5

# Giới hạn số request /api mỗi phút cho 1 IP (vượt -> lỗi 429 "thao tác quá nhanh"): tổng, request ghi, đăng nhập.
# Đặt enabled=false khi đo tải / chạy test tự động nhiều request (biến môi trường APP_RATE_LIMIT=false).
app.security.rate-limit.enabled=${APP_RATE_LIMIT:true}
app.security.rate-limit.requests-per-minute=1000
app.security.rate-limit.writes-per-minute=300
app.security.rate-limit.logins-per-minute=20

# HSTS (bắt trình duyệt nhớ "chỉ vào địa chỉ này bằng HTTPS" trong 1 năm). PHẢI để false với chứng chỉ tự ký:
# đã nhận HSTS thì Chrome không cho bấm "Tiếp tục" qua cảnh báo chứng chỉ nữa, và chạy lại bằng HTTP cũng không vào được.
# Chỉ bật khi có tên miền + chứng chỉ thật. Chi tiết: SecurityHeadersFilter.java.
app.security.hsts=false
