<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Thực Đơn - Tiệm Trà Thượng Hạng</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/index.css" />

    <style>
      .sidebar-menu {
        position: sticky;
        top: 100px;
        padding-right: 20px;
      }
      .sidebar-link {
        display: block;
        padding: 12px 0;
        color: var(--text-dark);
        font-weight: 500;
        text-transform: uppercase;
        font-size: 0.9rem;
        letter-spacing: 0.5px;
        transition: all 0.2s;
        border-bottom: 1px solid rgba(141, 110, 99, 0.1);
      }
      .sidebar-link:hover {
        color: var(--primary-color);
        padding-left: 5px;
      }
      .sidebar-link.active {
        color: var(--primary-color);
        font-weight: 700;
        border-left: 3px solid var(--primary-color);
        padding-left: 10px;
      }

      .product-card {
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }
      .product-card:hover img {
        transform: scale(1.05);
      }

      /* --- BẮT ĐẦU ĐOẠN FIX ẢNH VUÔNG --- */
      .product-card .card-img-wrapper {
        position: relative;
        width: 100%;
        padding-top: 100%; /* Tạo khung vuông 1:1 */
        overflow: hidden;
        border-radius: 12px;
        background-color: #f8f9fa; /* Nền xám nhạt phòng ảnh lỗi trong suốt */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }

      .product-card .card-img-wrapper img,
      .product-card .card-img-top {
        position: absolute;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important; /* Ép ảnh vừa khung mà không bị méo */
        border-radius: 12px;
        transition: transform 0.3s ease;
      }
      /* --- KẾT THÚC ĐOẠN FIX ẢNH VUÔNG --- */

      .product-name {
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.95rem;
        margin-top: 10px;
        color: var(--text-dark);
      }

      .btn-magic {
        background: linear-gradient(135deg, #9b59b6, #8e44ad);
        color: white;
        border: none;
        box-shadow: 0 4px 10px rgba(155, 89, 182, 0.3);
      }
      .btn-magic:active {
        transform: scale(0.9);
      }

      .mood-card {
        border: 2px solid #f0f0f0;
        border-radius: 16px;
        padding: 15px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        background: white;
      }
      .mood-card:hover {
        border-color: #8d6e63;
        background-color: #fdfbf7;
        transform: translateY(-3px);
      }
      .mood-icon {
        font-size: 2rem;
        margin-bottom: 5px;
        display: block;
      }

      /* Custom cho Banner Trượt */
      .carousel-item img {
        height: 250px;
        object-fit: cover;
        filter: brightness(0.9);
      }
      .carousel-indicators [data-bs-target] {
        background-color: #fff;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin: 0 5px;
      }
      .carousel-indicators .active {
        background-color: var(--primary-color);
      }

      @media (min-width: 768px) {
        .mobile-category-nav {
          display: none !important;
        }
      }
      @media (max-width: 767.98px) {
        .desktop-sidebar {
          display: none !important;
        }
        .carousel-item img {
          height: 180px;
        }
      }
    </style>
  </head>
  <body class="bg-light">
    <header class="fixed-top bg-white shadow-sm pt-3 pb-2 px-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="d-flex align-items-center gap-2">
          <div
            class="d-flex align-items-center justify-content-center rounded-circle header-logo"
            style="
              width: 45px;
              height: 45px;
              background: #4e342e;
              color: #d4af37;
              border: 1px solid #d4af37;
            "
          >
            <i class="bi bi-cup-hot-fill fs-5"></i>
          </div>
          <div>
            <h5
              class="fw-bold m-0 header-title"
              style="
                font-family: &quot;Playfair Display&quot;, serif;
                color: #4e342e;
                line-height: 1.1;
                font-size: 1.2rem;
              "
            >
              Tiệm Trà
            </h5>
            <small
              class="text-muted d-block header-table"
              style="font-size: 0.75rem"
            >
              <i class="bi bi-qr-code-scan"></i> Bàn:
              <span id="table-number" class="fw-bold text-dark">...</span>
            </small>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button
            class="btn btn-magic rounded-circle"
            data-bs-toggle="modal"
            data-bs-target="#moodModal"
          >
            <i class="bi bi-magic"></i>
          </button>
          <button
            class="btn btn-light rounded-circle border text-dark"
            data-bs-toggle="modal"
            data-bs-target="#searchModal"
          >
            <i class="bi bi-search"></i>
          </button>
        </div>
      </div>

      <div class="category-scroll mobile-category-nav d-flex gap-2">
        <button
          class="btn btn-custom active"
          data-loai="all"
          onclick="filterMenu('all')"
        >
          Tất cả
        </button>
        <button
          class="btn btn-custom"
          data-loai="1"
          onclick="filterMenu('tra-sua')"
        >
          Trà sữa
        </button>
        <button
          class="btn btn-custom"
          data-loai="2"
          onclick="filterMenu('tra-dac-san')"
        >
          Trà nguyên vị
        </button>
        <button
          class="btn btn-custom"
          data-loai="3"
          onclick="filterMenu('tra-trai-cay')"
        >
          Trà trái cây
        </button>
        <button
          class="btn btn-custom"
          data-loai="4"
          onclick="filterMenu('ca-phe')"
        >
          Cà phê
        </button>
        <button
          class="btn btn-custom"
          data-loai="5"
          onclick="filterMenu('matcha')"
        >
          Matcha
        </button>
        <button
          class="btn btn-custom"
          data-loai="6"
          onclick="filterMenu('san-pham-goi')"
        >
          Túi trà / Quà tặng
        </button>
      </div>
    </header>

    <div
      class="container-fluid main-container"
      style="padding-top: 130px; padding-bottom: 90px; max-width: 1400px"
    >
      <div class="row">
        <div class="col-md-3 col-lg-2 desktop-sidebar">
          <div class="sidebar-menu">
            <h6 class="text-muted fw-bold mb-3 small">DANH MỤC</h6>
            <a
              href="#"
              class="sidebar-link active"
              data-loai="all"
              onclick="filterMenu('all')"
              >Tất cả sản phẩm</a
            >
            <a
              href="#"
              class="sidebar-link"
              data-loai="1"
              onclick="filterMenu('tra-sua')"
              >Trà sữa</a
            >
            <a
              href="#"
              class="sidebar-link"
              data-loai="2"
              onclick="filterMenu('tra-dac-san')"
              >Trà nguyên vị</a
            >
            <a
              href="#"
              class="sidebar-link"
              data-loai="3"
              onclick="filterMenu('tra-trai-cay')"
              >Trà trái cây</a
            >
            <a
              href="#"
              class="sidebar-link"
              data-loai="4"
              onclick="filterMenu('ca-phe')"
              >Cà phê</a
            >
            <a
              href="#"
              class="sidebar-link"
              data-loai="5"
              onclick="filterMenu('matcha')"
              >Matcha</a
            >
            <a
              href="#"
              class="sidebar-link"
              data-loai="6"
              onclick="filterMenu('san-pham-goi')"
              >Túi trà / Quà tặng</a

          </div>
        </div>

        <div class="col-12 col-md-9 col-lg-10">
          <div
            class="mb-4 rounded-4 overflow-hidden shadow-sm position-relative"
          >
            <div
              id="promoCarousel"
              class="carousel slide"
              data-bs-ride="carousel"
              data-bs-interval="3000"
            >
              <div class="carousel-indicators">
                <button
                  type="button"
                  data-bs-target="#promoCarousel"
                  data-bs-slide-to="0"
                  class="active"
                ></button>
                <button
                  type="button"
                  data-bs-target="#promoCarousel"
                  data-bs-slide-to="1"
                ></button>
                <button
                  type="button"
                  data-bs-target="#promoCarousel"
                  data-bs-slide-to="2"
                ></button>
              </div>
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img
                    src="assets/img/banner1.jpg"
                    class="d-block w-100"
                    onerror="
                      this.src =
                        'https://via.placeholder.com/800x250?text=Banner+Uu+Dai+1'
                    "
                  />
                </div>
                <div class="carousel-item">
                  <img
                    src="assets/img/banner2.jpg"
                    class="d-block w-100"
                    onerror="
                      this.src =
                        'https://via.placeholder.com/800x250?text=Banner+Uu+Dai+2'
                    "
                  />
                </div>
                <div class="carousel-item">
                  <img
                    src="assets/img/banner3.jpg"
                    class="d-block w-100"
                    onerror="
                      this.src =
                        'https://via.placeholder.com/800x250?text=Banner+Uu+Dai+3'
                    "
                  />
                </div>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <h4
              class="fw-bold text-uppercase m-0"
              id="current-category-title"
              style="color: #4e342e"
            >
              Tất cả sản phẩm
            </h4>
            <span class="text-muted small">Hương vị thượng hạng</span>
          </div>

          <div class="row g-4" id="menu-container">
            <div class="col-6 col-md-4 col-lg-4">
              <div
                class="card h-100 border-0 shadow-sm"
                style="background: transparent"
              >
                <div class="skeleton skeleton-img"></div>
                <div class="p-2">
                  <div class="skeleton skeleton-text mb-2"></div>
                  <div class="skeleton skeleton-price"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="fab-container dropup"
      style="position: fixed; bottom: 85px; right: 20px; z-index: 1030"
    >
      <button
        class="btn btn-warning shadow-lg rounded-pill px-3 py-2 fw-bold text-white d-flex align-items-center gap-2"
        type="button"
        data-bs-toggle="dropdown"
        style="background-color: #d4af37; border: none"
      >
        <i class="bi bi-bell-fill"></i> Gọi phục vụ
      </button>
      <ul class="dropdown-menu shadow-lg border-0 rounded-4 p-2 mb-2">
        <li>
          <button

          >
            🫖 Xin thêm nước nóng

        </li>
        <li>
          <button
            class="dropdown-item py-2"
            onclick="requestService('Xin khăn giấy')"
          >
            🧻 Xin khăn giấy
          </button>
        </li>
        <li>
          <button
            class="dropdown-item py-2"
            onclick="requestService('Tư vấn trà')"
          >
            🍵 Tư vấn trà
          </button>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <button
            class="dropdown-item text-danger fw-bold py-2"
            onclick="requestService('Thanh toán tiền')"
          >
            💵 Gọi thanh toán
          </button>
        </li>
      </ul>
    </div>

    <nav
      class="navbar fixed-bottom bg-white shadow-lg border-top p-0 safe-area-pb"
    >
      <div class="container-fluid p-2">
        <div class="d-flex w-100 align-items-center justify-content-between">
          <a
            href="pages/tracking.html"
            class="d-flex flex-column align-items-center text-decoration-none text-muted px-3"
          >
            <i class="bi bi-clock-history fs-5"></i>
            <span style="font-size: 10px">Đơn hàng</span>
          </a>

          <button
            class="btn btn-primary rounded-pill flex-grow-1 mx-2 py-2 d-flex justify-content-between align-items-center shadow-primary"
            onclick="goToCart()"
          >
            <span class="badge bg-white text-primary rounded-pill">0</span>
            <span class="fw-bold">Xem giỏ hàng</span>
            <span class="fw-bold">0đ</span>
          </button>

          <a
            href="#"
            class="d-flex flex-column align-items-center text-decoration-none text-muted px-3"
          >
            <i class="bi bi-person-circle fs-5"></i>
            <span style="font-size: 10px">Tôi</span>
          </a>
        </div>
      </div>
    </nav>

    <div class="modal fade" id="productModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg rounded-4">
          <div class="position-relative">
            <img
              id="modal-img"
              src=""
              class="w-100 object-fit-cover"
              style="height: 250px"
            />
            <button
              type="button"
              class="btn-close btn-close-white position-absolute top-0 end-0 m-3 bg-white p-2 rounded-circle opacity-100"
              data-bs-dismiss="modal"
              style="z-index: 10; cursor: pointer"
            ></button>
          </div>

          <div class="modal-body p-4">
            <div class="d-flex justify-content-between mb-2 align-items-start">
              <h5 class="fw-bold mb-0" id="modal-name">Tên món</h5>
              <h5 class="fw-bold text-primary mb-0" id="modal-base-price">
                0đ
              </h5>
            </div>

            <p id="mood-message" class="text-success fw-bold small d-none mb-1">
              <i class="bi bi-stars"></i> Gợi ý riêng cho bạn!
            </p>
            <p id="modal-desc" class="text-muted small">Mô tả sản phẩm...</p>
            <hr class="opacity-10" />

            <div class="mb-3">
              <label class="fw-bold small text-uppercase text-muted mb-2"
                >Kích thước</label
              >
              <div class="d-flex gap-2" id="size-options"></div>
            </div>

            <div class="mb-3">
              <label class="fw-bold small text-uppercase text-muted mb-2"
                >Độ ngọt</label
              >
              <div class="option-scroll-x" id="sugar-options"></div>
            </div>

            <div class="mb-3">
              <label class="fw-bold small text-uppercase text-muted mb-2"
                >Topping</label
              >
              <div class="d-flex flex-column gap-2" id="topping-list"></div>
            </div>

            <div class="mb-3">
              <label class="fw-bold small text-uppercase text-muted mb-2"
                >Ghi chú</label
              >
              <textarea
                class="form-control bg-light border-0"
                id="modal-note"
                rows="2"
                placeholder="Ví dụ: Ít đá, nhiều trân châu..."
              ></textarea>
            </div>
          </div>

          <div class="modal-footer border-top-0 p-3 shadow-top">
            <div
              class="d-flex w-100 align-items-center justify-content-between gap-3"
            >
              <div
                class="d-flex align-items-center bg-light rounded-pill p-1 border"
              >
                <button
                  class="btn btn-sm btn-light rounded-circle fw-bold"
                  onclick="updateQuantity(-1)"
                >
                  -
                </button>
                <span class="fw-bold mx-3" id="modal-quantity">1</span>
                <button
                  class="btn btn-sm btn-light rounded-circle fw-bold"
                  onclick="updateQuantity(1)"
                >
                  +
                </button>
              </div>
              <button
                class="btn btn-primary rounded-pill flex-grow-1 py-2 fw-bold shadow-primary"
                onclick="addToCart()"
              >
                Thêm • <span id="modal-total-price">0đ</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="searchModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div
          class="modal-content border-0 shadow rounded-4"
          style="
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
          "
        >
          <div class="modal-body p-3">
            <div class="input-group bg-light rounded-pill p-1 border">
              <span class="input-group-text bg-transparent border-0"
                ><i class="bi bi-search"></i
              ></span>
              <input
                type="text"
                id="search-input"
                class="form-control border-0 bg-transparent shadow-none"
                placeholder="Tìm sản phẩm..."
                onkeyup="searchProduct()"
              />
              <button
                type="button"
                class="btn-close m-2"
                data-bs-dismiss="modal"
              ></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="moodModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
          <div class="modal-body p-4 text-center">
            <h5 class="fw-bold mb-3" style="color: #8d6e63">
              Hôm nay bạn thế nào?
            </h5>
            <div class="row g-3">
              <div class="col-6">
                <div class="mood-card" onclick="handleMood('stress')">
                  <span class="mood-icon">🤯</span
                  ><span class="fw-bold small">Căng thẳng</span>
                </div>
              </div>
              <div class="col-6">
                <div class="mood-card" onclick="handleMood('sleepy')">
                  <span class="mood-icon">😴</span
                  ><span class="fw-bold small">Buồn ngủ</span>
                </div>
              </div>
              <div class="col-6">
                <div class="mood-card" onclick="handleMood('happy')">
                  <span class="mood-icon">🥳</span
                  ><span class="fw-bold small">Vui vẻ</span>
                </div>
              </div>
              <div class="col-6">
                <div class="mood-card" onclick="handleMood('love')">
                  <span class="mood-icon">🥰</span
                  ><span class="fw-bold small">Đang yêu</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="assets/js/main.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const tableEl = document.getElementById("table-number");
        const params = new URLSearchParams(window.location.search);
        const idBan = params.get("idBan");

        if (idBan) {
          tableEl.innerText = "Bàn " + idBan;
          localStorage.setItem("idBan", idBan);
        } else {
          tableEl.innerText = "Mang đi";
          localStorage.removeItem("idBan");
        }
      });
    </script>

    <script>
      const API_BAN_AN = "http://localhost:8080/ban-an";

      document.addEventListener("DOMContentLoaded", () => {
        const idBan = localStorage.getItem("idBan");
        if (!idBan) return;

        const flagKey = `table_occupied_${idBan}`;

        if (!localStorage.getItem(flagKey)) {
          fetch(`${API_BAN_AN}/${idBan}/trang-thai/1`, {
            method: "PUT",
          })
            .then(() => localStorage.setItem(flagKey, "true"))
            .catch(() => {});
        }
      });
    </script>

    <script>
      function goToCart() {
        const params = new URLSearchParams(window.location.search);
        let idBan =
          params.get("idBan") ||
          sessionStorage.getItem("idBan") ||
          localStorage.getItem("idBan");

        if (idBan) {
          window.location.href = "pages/cart.html?table=" + idBan;
        } else {
          window.location.href = "pages/cart.html";
        }
      }
    </script>
  </body>
</html>
