<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro&display=swap" rel="stylesheet">

    <style>
         :root {
            --admin-primary: #4e342e;
            --admin-bg: #f5f5f5;
        }
        
        body {
            font-family: "Be Vietnam Pro", sans-serif;
            background: var(--admin-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url("https://static.kienviet.net/storage/uploads/2025/02/tiem-tra-cua-trang-he-thong-khung-dung-bao-che-cong-trinh-sonstudio_3.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .card-box {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
        }
        
        .title {
            color: var(--admin-primary);
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .btn-main {
            background: var(--admin-primary);
            color: #fff;
            border-radius: 10px;
            padding: 12px;
        }
        
        .btn-main:hover {
            background: #3e2723;
            color: #fff;
        }
        
        .btn-outline-main {
            border: 2px solid var(--admin-primary);
            color: var(--admin-primary);
            border-radius: 10px;
            padding: 12px;
        }
        
        .btn-outline-main:hover {
            background: var(--admin-primary);
            color: #fff;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card-box" id="roleSelect">
        <h4 class="title">Đăng nhập</h4>

        <div class="d-grid gap-3">
            <button class="btn btn-main" onclick="showAdmin()">
        🔐 Quản lý
      </button>

            <button class="btn btn-outline-main" onclick="showStaff()">
        👤 Nhân viên
      </button>
        </div>
    </div>

    <div class="card-box hidden" id="adminLogin">
        <h4 class="title">Quản lý</h4>

        <form>
            <div class="mb-3">
                <label class="form-label">Tài khoản</label>
                <input type="text" class="form-control" placeholder="admin@gmail.com">
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" placeholder="••••••••">
            </div>

            <div class="d-grid gap-2">
                <button class="btn btn-main">Đăng nhập</button>
                <button type="button" class="btn btn-secondary" onclick="goBack()">⬅ Quay lại</button>
            </div>
        </form>
    </div>

    <div class="card-box hidden" id="staffLogin">
        <h4 class="title">Nhân viên</h4>

        <form>
            <div class="mb-3">
                <label class="form-label">Mã nhân viên</label>
                <input type="text" class="form-control" placeholder="NV001">
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" placeholder="••••••••">
            </div>

            <div class="d-grid gap-2">
                <button class="btn btn-main">Đăng nhập</button>
                <button type="button" class="btn btn-secondary" onclick="goBack()">⬅ Quay lại</button>
            </div>
        </form>
    </div>

    <script>
        function showAdmin() {
            document.getElementById("roleSelect").classList.add("hidden");
            document.getElementById("adminLogin").classList.remove("hidden");
        }

        function showStaff() {
            document.getElementById("roleSelect").classList.add("hidden");
            document.getElementById("staffLogin").classList.remove("hidden");
        }

        function goBack() {
            document.getElementById("roleSelect").classList.remove("hidden");
            document.getElementById("adminLogin").classList.add("hidden");
            document.getElementById("staffLogin").classList.add("hidden");
        }
    </script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            let username = document.getElementById("username").value;
            let matKhau = document.getElementById("matKhau").value;

            fetch("http://localhost:8080/api/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: "username=" + username + "&matKhau=" + matKhau
                })
                .then(response => response.text())
                .then(data => {
                    document.getElementById("message").innerText = data;

                    if (data.includes("thành công")) {
                        // chuyển trang nếu login thành công
                        window.location.href = "dashboard.html";
                    }
                })
                .catch(error => console.error("Lỗi:", error));
        });
    </script>

</body>

</html>
