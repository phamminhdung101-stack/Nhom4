<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng - Tiệm Trà Thượng Hạng</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      .qty-btn {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid #ddd;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #8d6e63;
        transition: all 0.2s;
        cursor: pointer;
      }
      .qty-btn:active {
        background-color: #8d6e63;
        color: #fff;
      }
      /* Ẩn hiện smooth */
      .hidden-section {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-light">
    <header class="fixed-top bg-white shadow-sm p-3 d-flex align-items-center">
      <a href="#" class="text-dark me-3" onclick="goBackToMenu()">
  <i class="bi bi-arrow-left fs-4"></i>
</a>
      <h5 class="m-0 fw-bold">Giỏ hàng</h5>
    </header>

    <div class="container" style="margin-top: 80px; margin-bottom: 140px">
      <div id="cart-items-container" class="d-flex flex-column gap-3"></div>

      <div class="bg-white p-3 rounded-4 shadow-sm mt-3">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"
            ><i class="bi bi-ticket-perforated text-primary"></i
          ></span>
          <input
            type="text"
            class="form-control border-start-0 ps-0"
            placeholder="Mã giảm giá (ví dụ: TET2024)"
          />
          <button class="btn btn-outline-primary" type="button">Áp dụng</button>
        </div>
      </div>

      <div class="bg-white p-3 rounded-4 shadow-sm mt-3">
        <div class="d-flex justify-content-between mb-2">
          <span class="text-muted">Tạm tính</span>
          <span class="fw-bold" id="temp-total">0đ</span>
        </div>
        <div class="d-flex justify-content-between">
          <span class="text-muted">Giảm giá</span>
          <span class="text-success fw-bold">-0đ</span>
        </div>
        <hr />
        <div class="d-flex justify-content-between fs-5">
          <span class="fw-bold">Tổng cộng</span>
          <span class="fw-bold text-primary" id="final-total">0đ</span>
        </div>
      </div>
    </div>

    <nav class="navbar fixed-bottom bg-white shadow-top p-3 safe-area-pb">
      <div class="w-100">
        <button
          class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-primary fs-6"
          onclick="openCheckoutModal()"
        >
          Xác nhận đặt món • <span id="btn-total">0đ</span>
        </button>
      </div>
    </nav>

    <div class="modal fade" id="checkoutModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold">Xác nhận đơn hàng</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div
              id="table-confirm-view"
              class="text-center py-2 hidden-section"
            >
              <div class="mb-3">
                <img
                  src="https://cdn-icons-png.flaticon.com/512/2921/2921822.png"
                  width="60"
                  class="mb-2"
                />
                <h5 class="fw-bold text-primary" id="table-confirm-title"></h5>
                <script>
const idBan = localStorage.getItem("idBan");
const title = document.getElementById("table-confirm-title");

if (idBan) {
  title.innerText = "Bàn " + idBan;
} else {
  title.innerText = "Mang đi";
}
</script>
                <p class="text-muted small">
                  Đơn hàng sẽ được gửi xuống bếp ngay.<br />
                  Nhân viên sẽ đến <b>thanh toán tại bàn</b> sau khi phục vụ.
                </p>
              </div>
            </div>

            <form id="checkoutForm" class="hidden-section">
              <div
                class="alert alert-light border-0 shadow-sm small text-muted mb-3"
              >
                <i class="bi bi-info-circle-fill text-primary"></i>
                Vui lòng nhập thông tin để chúng tôi liên hệ khi món xong.
              </div>

              <div class="mb-3">
                <label class="form-label small text-muted fw-bold"
                  >Tên của bạn <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control rounded-3 bg-light border-0"
                  id="customerName"
                  placeholder="Ví dụ: Minh..."
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label small text-muted fw-bold"
                  >Số điện thoại <span class="text-danger">*</span></label
                >
                <input
                  type="tel"
                  class="form-control rounded-3 bg-light border-0"
                  id="customerPhone"
                  placeholder="09xxxx..."
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label small text-muted fw-bold"
                  >Hình thức</label
                >
                <div class="d-flex gap-2">
                  <input
                    type="radio"
                    class="btn-check"
                    name="orderType"
                    id="typeTakeaway"
                    value="takeaway"
                    checked
                  />
                  <label
                    class="btn btn-outline-secondary rounded-pill flex-grow-1"
                    for="typeTakeaway"
                    >Mang về</label
                  >
                </div>
              </div>
            </form>

            <div class="mt-2">
              <textarea
                class="form-control bg-light border-0 small"
                rows="2"
                id="orderNote"
                placeholder="Ghi chú thêm cho bếp (Ít ngọt, nhiều đá...)..."
              ></textarea>
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button
              type="button"
              class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-primary"
              onclick="submitCheckout()"
              id="btn-confirm-action"
            >
              Gửi Bếp Ngay
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   <script>
  const API_BAN_AN = "http://localhost:8080/api/ban-an";
  const API_CART = "http://localhost:8080/api/gio-hang";

  let cart = [];
  let cartData = null;

  const urlParams = new URLSearchParams(window.location.search);
let tableId = urlParams.get("idBan");

if (tableId) {
  localStorage.setItem("idBan", tableId);
} else {
  tableId = localStorage.getItem("idBan");
}

// Nếu vẫn không có thì mới báo lỗi
if (!tableId) {
  alert("Không tìm thấy bàn!");
  window.location.href = "../welcome.html";
} else {
  // Lưu lại để các trang khác dùng
  localStorage.setItem("current_table_id", tableId);
}

  const loggedUser = JSON.parse(localStorage.getItem("user_login"));

  async function renderCartPage() {
    if (!tableId) {
      document.getElementById("cart-items-container").innerHTML =
        "<p class='text-center text-muted'>Không tìm thấy bàn.</p>";
      return;
    }

    try {
      const res = await fetch(`${API_CART}/${tableId}`);

if (!res.ok) {
  cart = [];
} else {
  cartData = await res.json();
  cart = cartData.items || [];

  // đảm bảo đúng format từ MongoDB
 cart = cart.map(i => ({
  idMon: i.idMon,
  tenMon: i.tenMon ?? i.ten ?? "",
  soLuong: i.soLuong ?? 0,
  gia: i.donGia ?? i.gia ?? 0
}));
}
    } catch (error) {
      console.error("Lỗi load giỏ:", error);
      return;
    }

    const container = document.getElementById("cart-items-container");
    let totalMoney = 0;

    if (cart.length === 0) {
      container.innerHTML = `
        <div class="text-center py-5">
            <i class="bi bi-cart-x fs-1 text-muted"></i>
            <p class="mt-3 text-muted">Giỏ hàng trống trơn!</p>
            <a href="../index.html?idBan=${tableId}" class="btn btn-outline-primary rounded-pill">Về thực đơn</a>
        </div>`;
      updateTotal(0);
      return;
    }

    let html = "";

    cart.forEach((item) => {
      const donGia = item.gia || 0;
const soLuong = item.soLuong || 0;
const thanhTien = donGia * soLuong;

      totalMoney += thanhTien;

      html += `
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden position-relative mb-2">
            <div class="d-flex p-2">
                <div class="flex-grow-1 ms-3 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between">
                            <h6 class="fw-bold mb-1">${item.tenMon}</h6>
                            <i class="bi bi-trash text-danger"
                               onclick="removeItem('${item.idMon}')"
                               style="cursor:pointer;"></i>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-1">
                        <span class="text-primary fw-bold">
                          ${thanhTien.toLocaleString("vi-VN")}đ
                        </span>
                        <div class="d-flex align-items-center gap-2">
                            <button class="qty-btn"
                               onclick="updateItemQty('${item.idMon}', -1)">-</button>
                            <span class="fw-bold">${soLuong}</span>
                            <button class="qty-btn"
                               onclick="updateItemQty('${item.idMon}', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>`;
    });

    container.innerHTML = html;
    updateTotal(totalMoney);
  }

 
  function updateTotal(amount) {
    const moneyStr = amount.toLocaleString("vi-VN") + "đ";
    document.getElementById("temp-total").innerText = moneyStr;
    document.getElementById("final-total").innerText = moneyStr;
    document.getElementById("btn-total").innerText = moneyStr;
  }

 async function removeItem(idMon) {
  const confirmDelete = confirm("Bạn có chắc muốn xoá món này?");
  if (!confirmDelete) return;

  try {

    const res = await fetch(
      `${API_CART}/${tableId}/remove/${idMon}`,
      { method: "DELETE" }
    );

    if (!res.ok) {
      alert("Không xoá được món");
      return;
    }

    await renderCartPage();

  } catch (error) {
    console.error("Lỗi xoá món:", error);
  }
}

  function openCheckoutModal() {
    if (cart.length === 0) return alert("Giỏ hàng đang trống!");

    const checkoutModal = new bootstrap.Modal(
      document.getElementById("checkoutModal"),
    );

    if (tableId) {
      document
        .getElementById("table-confirm-view")
        .classList.remove("hidden-section");
      document
        .getElementById("checkoutForm")
        .classList.add("hidden-section");

      document.getElementById("table-confirm-title").innerHTML =
        `BÀN SỐ ${tableId}`;
      document.getElementById("btn-confirm-action").innerText =
        "GỌI MÓN NGAY";
    } else {
      document
        .getElementById("table-confirm-view")
        .classList.add("hidden-section");
      document
        .getElementById("checkoutForm")
        .classList.remove("hidden-section");
      document.getElementById("btn-confirm-action").innerText =
        "HOÀN TẤT & GỬI BẾP";

      if (loggedUser) {
        document.getElementById("customerName").value =
          loggedUser.name || "";
        document.getElementById("customerPhone").value =
          loggedUser.phone || "";
      }
    }

    checkoutModal.show();
  }

  renderCartPage();

  async function submitCheckout() {

  if (cart.length === 0) {
    alert("Giỏ hàng trống!");
    return;
  }

  let totalMoney = 0;
  cart.forEach(i => {
    totalMoney += (i.gia || 0) * (i.soLuong || 0);
  });

  const donHangData = {
    idGioHang: Number(tableId),
    idKhuyenMai: 0,
    ghiChu: document.getElementById("orderNote").value || "",
    tongTien: totalMoney,
    trangThai: 0
  };

  try {

    //  LƯU VÀO COLLECTION don_hang
    await fetch("http://localhost:8080/api/don-hang", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(donHangData)
    });

    //  Cập nhật trạng thái bàn
    if (tableId) {
      await fetch(`${API_BAN_AN}/${tableId}/trang-thai/1`, {
        method: "PUT"
      });
    }

    //  Xoá giỏ hàng sau khi đặt
    await fetch(`${API_CART}/${tableId}`, {
      method: "DELETE"
    });

    triggerConfetti();

    setTimeout(() => {
      window.location.href = "tracking.html?idBan=" + tableId;
    }, 800);

  } catch (error) {
    console.error("Lỗi tạo đơn hàng:", error);
    alert("Không thể tạo đơn hàng!");
  }
}

function triggerConfetti() {
  var duration = 1.5 * 1000;
  var end = Date.now() + duration;
  (function frame() {
    confetti({
      particleCount: 4,
      angle: 60,
      spread: 55,
      origin: { x: 0 },
      colors: ["#8D6E63", "#FFD700"],
    });
    confetti({
      particleCount: 4,
      angle: 120,
      spread: 55,
      origin: { x: 1 },
      colors: ["#8D6E63", "#FFD700"],
    });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
}

function goBackToMenu() {
  if (tableId) {
    window.location.href = "../index.html?idBan=" + tableId;
  } else {
    window.location.href = "../index.html";
  }
}

async function updateItemQty(idMon, change) {

  const item = cart.find(i => i.idMon == idMon);
  if (!item) return;

  const newQty = item.soLuong + change;

  if (newQty <= 0) {
    return removeItem(idMon);
  }

  try {

    const res = await fetch(`${API_CART}/${tableId}/update`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        idMon: idMon,
        soLuong: newQty
      })
    });

    if (!res.ok) throw new Error();

    await renderCartPage();

  } catch (error) {
    console.error("Lỗi cập nhật số lượng:", error);
  }
}

async function confirmOrder() {

    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    if (cart.length === 0) return;

    const idDonHang = Date.now();

    for (let item of cart) {

        const body = {
            idChiTiet: Date.now() + Math.floor(Math.random() * 1000),
            idDonHang: idDonHang,
            idNV: 1,
            soLuong: item.quantity,
            donGiaThanhTien: {
                donGia: item.price,
                thanhTien: item.price * item.quantity
            },
            ghiChu: item.note || "",
            trangThai: 0
        };

        await fetch("http://localhost:8080/api/chi-tiet-don", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        });
    }

    localStorage.removeItem("cart");
    window.location.href = "success.html";
}

</script>
  </body>
</html>
